# Ephemeral S3 server (RustFS) for boto3-s3 manual testing and the e2e parity
# suite. endpoint-fidelity T15: how this server answers differently from real
# S3, and what the tests do about it, is in design/endpoint-fidelity.md.
#
# Usage (from repo root):
#   scripts/compose-up.sh          # start the stack, wait for bucket init
#   source scripts/dev-env.sh      # point AWS tooling (`aws` / boto3-s3) at it
#   uv run pytest tests/cli/e2e    # run the e2e parity suite
#   scripts/compose.sh down        # tear down (any compose subcommand works)
#
# Console: http://localhost:9001/rustfs/console/ (devadmin / devadmin)
# API:     http://localhost:9000
#
# State lives in tmpfs and disappears on `down`. To persist between runs,
# replace the tmpfs entries with named volumes owned by uid/gid 10001.

# Pinned so compose-up.sh can match the exact container name
# (boto3-s3-dev-s3-1) rather than any compose stack with an s3 service.
name: boto3-s3-dev

services:
  s3:
    # Pinned: design/endpoint-fidelity.md records how this release answers
    # differently from real S3, and a new release needs its probes re-run.
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: devadmin
      RUSTFS_SECRET_KEY: devadmin
      # SSE-S3 without a KMS needs a master key. This throwaway one only
      # guards objects that live in tmpfs.
      RUSTFS_SSE_S3_MASTER_KEY: uJzSlyF2T1+8cb1ChqXQ/N4KWKU6+JuRQBtSTT66ljc=
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs:
      # The image runs as uid/gid 10001.
      - /data:uid=10001,gid=10001
      - /logs:uid=10001,gid=10001

  # Creates the buckets the dev workflow expects: test-bucket for manual
  # play, boto3-s3-e2e for the e2e suite (which probes that it exists and is
  # empty before running).
  mc-init:
    image: pgsty/mc:latest
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 devadmin devadmin >/dev/null 2>&1; do sleep 1; done &&
      mc mb --ignore-existing local/test-bucket &&
      mc mb --ignore-existing local/boto3-s3-e2e
      "
    restart: "no"
